version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../test-case-generation
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=/api
    restart: always

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - FLASK_ENV=production
    env_file:
      - .env.production
    volumes:
      - lancedb_data:/app/lancedb_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery_worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_app.celery", "worker", "--loglevel=info"]
    env_file:
      - .env.production
    volumes:
      - lancedb_data:/app/lancedb_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery_beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_app.celery", "beat", "--loglevel=info"]
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-test_case_gen}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pg_data:
  lancedb_data:
