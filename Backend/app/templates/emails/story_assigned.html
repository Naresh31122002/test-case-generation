<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f6f9fc; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 20px; }
        p { font-size: 16px; line-height: 1.5; color: #555; }
        .meta { font-size: 14px; color: #888; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #6366f1; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: 500; margin-top: 20px; margin-bottom: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #999; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>You were assigned a story</h1>
        <p>Hi,</p>
        <p><strong>{{ actor_name }}</strong> assigned you to a story in <strong>{{ workspace_name }}</strong>.</p>
        <p class="meta"><strong>{{ story_id }}</strong> &mdash; {{ story_title }}</p>
        <a href="{{ link_url }}" class="btn">Open Story</a>
        <p>You can review, comment, and track progress from the story view.</p>
        <div class="footer">
            &copy; 2026 TestSurge. All rights reserved.
        </div>
    </div>
</body>
</html>
