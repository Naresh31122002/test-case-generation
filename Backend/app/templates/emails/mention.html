<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f6f9fc; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 20px; }
        p { font-size: 16px; line-height: 1.5; color: #555; }
        .meta { font-size: 14px; color: #888; }
        .quote { border-left: 3px solid #ec4899; padding: 8px 14px; margin: 16px 0; color: #444; background: #fef1f8; border-radius: 0 6px 6px 0; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #ec4899; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: 500; margin-top: 20px; margin-bottom: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #999; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ actor_name }} mentioned you</h1>
        <p>Hi,</p>
        <p><strong>{{ actor_name }}</strong> mentioned you in a comment on <strong>{{ target_id }}</strong> in <strong>{{ workspace_name }}</strong>.</p>
        <div class="quote">{{ comment_body }}</div>
        <a href="{{ link_url }}" class="btn">View Comment</a>
        <div class="footer">
            &copy; 2026 TestSurge. All rights reserved.
        </div>
    </div>
</body>
</html>
