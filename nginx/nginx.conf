events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Backend upstream
    upstream backend {
        server backend:5000;
    }

    # Production app frontend
    upstream app_frontend {
        server app_frontend:3000;
    }

    # Marketing/portfolio frontend
    upstream portfolio {
        server portfolio:3000;
    }

    server {
        listen 80;
        server_name app.testsurge.kynetropo.com app.testsurge.local;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        location = / {
            return 302 https://testsurge.kynetropo.com/app;
        }

        location = /app {
            return 302 https://testsurge.kynetropo.com/app;
        }

        location /app/ {
            return 302 https://testsurge.kynetropo.com$request_uri;
        }

        # Keep old direct app URLs working by moving them to the main domain /app path.
        location ~ ^/(login|signup|forgot-password|reset-password|verify-email|onboarding|projects|stories|changes|compare|coverage|exports|settings)(/.*)?$ {
            return 302 https://testsurge.kynetropo.com/app$request_uri;
        }

        location /api/ {
            return 302 https://testsurge.kynetropo.com/app$request_uri;
        }

        location / {
            return 302 https://testsurge.kynetropo.com/app$request_uri;
        }
    }

    server {
        listen 80 default_server;
        server_name testsurge.kynetropo.com www.testsurge.kynetropo.com _;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Route app-scoped API requests to Flask backend.
        location /app/api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings for heavy LLM operations
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;
        }

        # Backward-compatible API path for older builds or bookmarks.
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings for heavy LLM operations
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;
        }

        # Route the app base path to the new frontend.
        location = /app {
            proxy_pass http://app_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /app/ {
            proxy_pass http://app_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backward-compatible direct app links on the marketing domain.
        location ~ ^/(login|signup|forgot-password|reset-password|verify-email|onboarding|projects|stories|changes|compare|coverage|exports|settings)(/.*)?$ {
            return 302 /app$request_uri;
        }

        location / {
            proxy_pass http://portfolio;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
